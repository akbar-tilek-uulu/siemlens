# Publishes to PyPI when you cut a GitHub release.
#
# No API token is stored anywhere. This uses PyPI Trusted Publishing: PyPI is
# told to trust releases coming from this specific repository, workflow file
# and environment, and GitHub proves the request's origin with a short-lived
# OIDC token. That is why the publish job needs `id-token: write` and why the
# `environment:` name below must match what you configure on PyPI.
#
# One-time setup, before the first release:
#   1. https://pypi.org/manage/account/publishing/  ->  "Add a new pending publisher"
#   2. PyPI Project Name: siemlens
#      Owner:            <your GitHub username>
#      Repository name:  siemlens
#      Workflow name:    publish.yml
#      Environment name: pypi
#   3. In the GitHub repo: Settings -> Environments -> New environment -> "pypi"
#   4. Cut a release: Releases -> Draft a new release -> tag v0.1.0 -> Publish
#
# Check that the name `siemlens` is still free on https://pypi.org/project/siemlens/
# before step 1. If it is taken, rename the project in pyproject.toml first.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/siemlens
    permissions:
      id-token: write   # required for Trusted Publishing; nothing else needs it
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
